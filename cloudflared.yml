# ===============================
# Быстрый запуск временного туннеля (Quick Tunnel)
#
# 1. Откройте PowerShell и перейдите в папку с cloudflared:
#    Set-Location C:\cloudflared
#
# 2. Запустите временный туннель командой:
#    .\cloudflared.exe tunnel --url http://localhost:80
#
# 3. В консоли появится временный публичный адрес вида:
#    https://random-string.trycloudflare.com
#    (он будет проксировать на http://localhost:80)
#
# ⚠️ Этот способ не требует регистрации и конфиг-файла, но адрес будет каждый раз новый!
# =============================== 