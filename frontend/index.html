<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CabrioRide - Автомобили</title>
    
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Telegram WebApp - настройка цвета фона */
        :root {
            --tg-theme-bg-color: #0a0a0a;
            --tg-theme-text-color: #ffffff;
            --tg-theme-hint-color: rgba(255, 255, 255, 0.6);
            --tg-theme-link-color: #667eea;
            --tg-theme-button-color: #667eea;
            --tg-theme-button-text-color: #ffffff;
        }

        /* Мобильная навигация */
        .mobile-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid #333;
            z-index: 1000;
            padding: env(safe-area-inset-top) 0 0 0;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            max-width: 480px;
            margin: 0 auto;
            gap: 8px;
        }

        .header-search {
            flex: 1;
            position: relative;
        }

        .header-search-input {
            width: 100%;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            font-size: 11px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .header-search-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .header-search-input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .header-filters {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .header-filter-select {
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #333;
            border-radius: 10px;
            color: #fff;
            font-size: 10px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            min-width: 60px;
        }

        .header-filter-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .header-filter-select option {
            background: #1a1a1a;
            color: #fff;
            font-size: 10px;
        }

        .refresh-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .refresh-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .refresh-btn:active {
            transform: scale(0.95);
        }

        /* Основной контент */
        .main-content {
            margin-top: 60px;
            padding: 15px;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
            padding-bottom: calc(80px + env(safe-area-inset-bottom));
        }

        /* Фильтры */
        .filters-section {
            margin-bottom: 20px;
        }

        .search-container {
            margin-bottom: 15px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #333;
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .filters-row {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .filter-select {
            flex: 1;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
            font-size: 11px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .filter-select:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-select option {
            background: #1a1a1a;
            color: #fff;
        }

        /* Сетка автомобилей */
        .cars-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        /* Карточки автомобилей */
        .car-card {
            background: var(--card-bg, linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%));
            border: 1px solid var(--border-color, #333);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .car-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            border-color: #667eea;
        }

        .car-card:active {
            transform: scale(0.98);
        }

        .car-image-container {
            position: relative;
            width: 100%;
            height: 100px;
            overflow: hidden;
        }

        .car-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.2s ease;
        }

        .car-card:hover .car-image {
            transform: scale(1.02);
        }

        .no-photo {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #333 0%, rgba(255, 255, 255, 0.1) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.5rem;
        }

        /* Индикатор количества фото */
        .photos-count {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 2px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Статус автомобиля */
        .car-status-overlay {
            position: absolute;
            top: 4px;
            left: 4px;
        }

        .status-badge {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .status-success {
            background: rgba(76, 175, 80, 0.9);
            color: white;
        }

        .status-warning {
            background: rgba(255, 152, 0, 0.9);
            color: white;
        }

        .status-primary {
            background: rgba(46, 166, 255, 0.9);
            color: white;
        }

        .status-error {
            background: rgba(244, 67, 54, 0.9);
            color: white;
        }

        .car-info {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
        }

        .car-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            margin: 0;
            line-height: 1.2;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .car-specs {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
        }

        .car-owner {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: auto;
        }

        .owner-avatar {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            overflow: hidden;
            background: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .avatar-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-initials {
            color: white;
            font-weight: 700;
            font-size: 8px;
        }

        .owner-name {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }

        /* Состояния загрузки */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin: 20px 0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            color: #fff;
        }

        .empty-state p {
            font-size: 1rem;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .retry-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            border-radius: 20px;
            max-width: 400px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid #333;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            }
            
        .modal-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .modal-details {
            display: grid;
            gap: 10px;
        }

        .modal-detail {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-detail-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .modal-detail-value {
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* Анимации */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
            }
            
        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(-100%); }
            to { transform: translateX(0); }
        }

        /* Адаптация для больших экранов */
        @media (min-width: 768px) {
            .main-content {
                max-width: 600px;
            }
            
            .cars-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
            }
        }

        /* Темная тема для системных элементов */
        @media (prefers-color-scheme: dark) {
            body {
                background: #000000;
            }
        }

        /* Футер */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--tg-theme-bg-color, #0a0a0a);
            border-top: 1px solid #333;
            display: flex;
            padding: 8px 0;
            padding-bottom: calc(8px + env(safe-area-inset-bottom));
            z-index: 100;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            text-decoration: none;
            color: #666666;
            transition: all 0.2s ease;
            min-height: 60px;
            position: relative;
            cursor: pointer;
        }

        .nav-item.active {
            color: #fff;
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 2px;
            background: #667eea;
            border-radius: 1px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 500;
            margin-top: 4px;
            text-align: center;
            line-height: 1;
        }

        .nav-icon {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        /* Модальное окно "В разработке" */
        .dev-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .dev-modal-content {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            border-radius: 20px;
            max-width: 300px;
            width: 100%;
            border: 1px solid #333;
            text-align: center;
            padding: 30px 20px;
        }

        .dev-modal-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            opacity: 0.7;
        }

        .dev-modal-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
        }

        .dev-modal-text {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .dev-modal-close {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dev-modal-close:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
    </style>
</head>
<body>
    <!-- Мобильная навигация -->
    <header class="mobile-header">
        <div class="header-content">
            <div class="header-search">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="header-search-input" 
                    placeholder="🔍 Поиск..."
                    autocomplete="off"
                />
        </div>
            <div class="header-filters">
                <select id="statusFilter" class="header-filter-select">
                    <option value="">Статус</option>
                </select>
            </div>
            <button class="refresh-btn" onclick="loadCars()" title="Обновить">
                🔄
            </button>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="main-content">
        <!-- Контент -->
        <div id="content">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div>Загрузка автомобилей...</div>
            </div>
        </div>
    </main>

    <!-- Футер -->
    <footer class="bottom-nav">
        <a href="members.html" class="nav-item">
            <span class="nav-icon">👥</span>
            <span class="nav-label">Участники</span>
        </a>
        <a href="index.html" class="nav-item active">
            <span class="nav-icon">🚗</span>
            <span class="nav-label">Авто</span>
        </a>
        <a href="map.html" class="nav-item">
            <span class="nav-icon">🗺️</span>
            <span class="nav-label">Карта</span>
        </a>
        <a href="events.html" class="nav-item">
            <span class="nav-icon">📅</span>
            <span class="nav-label">События</span>
        </a>
        <a href="services.html" class="nav-item">
            <span class="nav-icon">📖</span>
            <span class="nav-label">Гид</span>
        </a>
    </footer>

    <!-- Модальное окно -->
    <div id="carModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Автомобиль</h2>
                <button class="modal-close" onclick="closeCarModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Содержимое модального окна -->
            </div>
        </div>
    </div>

    <!-- Модальное окно "В разработке" -->
    <div id="devModal" class="dev-modal-overlay" style="display: none;">
        <div class="dev-modal-content">
            <div class="dev-modal-icon">⚙️</div>
            <div class="dev-modal-title">В разработке</div>
            <p class="dev-modal-text">
                Эта функция находится в активной разработке.
                Мы работаем над улучшением пользовательского опыта.
            </p>
            <button class="dev-modal-close" onclick="closeDevModal()">Закрыть</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        let tg = window.Telegram.WebApp;
        
        // Настройка WebApp для полноэкранного режима
        tg.ready();
        tg.expand(); // Развернуть на весь экран
        tg.enableClosingConfirmation(); // Подтверждение закрытия
        
        // Настройка темы
        tg.setHeaderColor('#1a1a1a');
        tg.setBackgroundColor('#0a0a0a');
        
        // Глобальные переменные
        let allCars = [];
        let filteredCars = [];
        let selectedCar = null;

        // Загрузка автомобилей при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            loadCars();
            
            // Поиск при вводе с debounce
            let searchTimeout;
            document.getElementById('searchInput').addEventListener('input', function() {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(filterCars, 300);
            });

            // Фильтры
            document.getElementById('statusFilter').addEventListener('change', filterCars);
        });

        // Загрузка автомобилей с сервера
        async function loadCars() {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="loading">
                    <div class="loading-spinner"></div>
                    <div>Загрузка автомобилей...</div>
                </div>
            `;

            try {
                const response = await fetch('./car.php', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.success && data.data) {
                    allCars = data.data;
                    filteredCars = [...allCars];
                    updateFilters();
                    displayCars();
                } else {
                    throw new Error(data.error?.message || 'Ошибка загрузки данных');
                }

            } catch (error) {
                console.error('Ошибка загрузки автомобилей:', error);
                content.innerHTML = `
                    <div class="error">
                        <strong>Ошибка загрузки:</strong><br>
                        ${error.message}
                        <br><br>
                        <button class="retry-btn" onclick="loadCars()">🔄 Попробовать снова</button>
                    </div>
                `;
            }
        }

        // Обновление фильтров
        function updateFilters() {
            const statuses = [...new Set(allCars.map(car => car.status).filter(status => status))].sort();
            
            const statusSelect = document.getElementById('statusFilter');
            
            // Очищаем и заполняем статусы
            statusSelect.innerHTML = '<option value="">Все статусы</option>';
            statuses.forEach(status => {
                const option = document.createElement('option');
                option.value = status;
                option.textContent = getStatusText(status);
                statusSelect.appendChild(option);
            });
        }

        // Фильтрация автомобилей
        function filterCars() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;
            
                filteredCars = allCars.filter(car => {
                // Поиск
                const matchesSearch = !searchTerm || 
                    (car.brand || '').toLowerCase().includes(searchTerm) ||
                    (car.model || '').toLowerCase().includes(searchTerm) ||
                    (car.plate_number || '').toLowerCase().includes(searchTerm) ||
                    (car.owner_name || '').toLowerCase().includes(searchTerm);
                
                // Фильтр по статусу
                const matchesStatus = !statusFilter || car.status === statusFilter;
                
                return matchesSearch && matchesStatus;
                });
            
            displayCars();
        }

        // Отображение автомобилей
        function displayCars() {
            const content = document.getElementById('content');
            
            if (filteredCars.length === 0) {
                if (allCars.length === 0) {
                    content.innerHTML = `
                        <div class="empty-state fade-in">
                            <div class="empty-state-icon">🚗</div>
                            <h3>Автомобили не найдены</h3>
                            <p>В базе данных пока нет автомобилей или произошла ошибка загрузки.</p>
                            <button class="retry-btn" onclick="loadCars()">🔄 Обновить</button>
                        </div>
                    `;
                } else {
                    content.innerHTML = `
                        <div class="empty-state fade-in">
                            <div class="empty-state-icon">🔍</div>
                            <h3>Ничего не найдено</h3>
                            <p>Попробуйте изменить фильтры поиска</p>
                            <button class="retry-btn" onclick="clearFilters()">🗑️ Очистить фильтры</button>
                        </div>
                    `;
                }
                return;
            }

            const carsHtml = filteredCars.map((car, index) => {
                // Обработка фото
                const photoHtml = car.photo_url ? 
                    `<img src="${car.photo_url}" alt="${car.plate_number || 'Автомобиль'}" class="car-image" onerror="this.parentElement.innerHTML='<div class=\\'no-photo\\'>🚗</div>'">` : 
                    '<div class="no-photo">🚗</div>';
                
                // Обработка названия автомобиля
                const brand = car.brand || 'Неизвестная марка';
                const model = car.model || 'Неизвестная модель';
                const carTitle = brand !== 'Неизвестная марка' && model !== 'Неизвестная модель' 
                    ? `${brand} ${model}` 
                    : brand === 'Неизвестная марка' && model !== 'Неизвестная модель'
                    ? model
                    : brand !== 'Неизвестная марка' && model === 'Неизвестная модель'
                    ? brand
                    : 'Автомобиль';
                
                // Спецификации автомобиля
                const specs = [];
                if (car.year) specs.push(car.year);
                if (car.color) specs.push(car.color);
                const specsText = specs.length > 0 ? specs.join(', ') : car.plate_number || 'Не указан';
                
                // Статус автомобиля
                const statusClass = getStatusClass(car.status);
                const statusIcon = getStatusIcon(car.status);
                
                // Инициалы владельца
                const ownerInitials = car.owner_name ? 
                    car.owner_name.split(' ').map(n => n.charAt(0)).join('').toUpperCase() : 
                    '?';
                
                return `
                    <div class="car-card slide-in" style="animation-delay: ${index * 0.1}s" onclick="selectCar(${car.id})">
                        <div class="car-image-container">
                            ${photoHtml}
                            
                            <!-- Статус автомобиля -->
                            <div class="car-status-overlay">
                                <span class="status-badge status-${statusClass}">
                                    ${statusIcon}
                                </span>
                            </div>
                            </div>
                        
                        <div class="car-info">
                            <div class="car-title">${carTitle}</div>
                            <div class="car-specs">${specsText}</div>
                            <div class="car-owner">
                                <div class="owner-avatar">
                                    <span class="avatar-initials">${ownerInitials}</span>
                            </div>
                                <div class="owner-name">${car.owner_name || 'Не указан'}</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            content.innerHTML = `
                <div class="cars-grid">
                    ${carsHtml}
                </div>
            `;
        }

        // Выбор автомобиля
        function selectCar(carId) {
            selectedCar = allCars.find(car => car.id === carId);
            if (selectedCar) {
                showCarModal();
                // Haptic feedback для Telegram
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('medium');
                }
            }
        }

        // Показать модальное окно
        function showCarModal() {
            if (!selectedCar) return;
            
            const modal = document.getElementById('carModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            
            // Заголовок
            const brand = selectedCar.brand || 'Неизвестная марка';
            const model = selectedCar.model || 'Неизвестная модель';
            modalTitle.textContent = `${brand} ${model}`;
            
            // Содержимое
            const photoHtml = selectedCar.photo_url ? 
                `<img src="${selectedCar.photo_url}" alt="${selectedCar.plate_number || 'Автомобиль'}" class="modal-image">` : 
                '<div class="modal-image" style="background: linear-gradient(135deg, #333 0%, rgba(255, 255, 255, 0.1) 100%); display: flex; align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.6); font-size: 3rem;">🚗</div>';
            
            modalBody.innerHTML = `
                ${photoHtml}
                <div class="modal-details">
                    <div class="modal-detail">
                        <span class="modal-detail-label">Номер</span>
                        <span class="modal-detail-value">${selectedCar.plate_number || 'Не указан'}</span>
                    </div>
                    <div class="modal-detail">
                        <span class="modal-detail-label">Владелец</span>
                        <span class="modal-detail-value">${selectedCar.owner_name || 'Не указан'}</span>
                    </div>
                    <div class="modal-detail">
                        <span class="modal-detail-label">Год</span>
                        <span class="modal-detail-value">${selectedCar.year || 'Не указан'}</span>
                    </div>
                    <div class="modal-detail">
                        <span class="modal-detail-label">Цвет</span>
                        <span class="modal-detail-value">${selectedCar.color || 'Не указан'}</span>
                    </div>
                    <div class="modal-detail">
                        <span class="modal-detail-label">Статус</span>
                        <span class="modal-detail-value">${getStatusText(selectedCar.status)}</span>
                    </div>
                    <div class="modal-detail">
                        <span class="modal-detail-label">Добавлен</span>
                        <span class="modal-detail-value">${formatDate(selectedCar.created_at)}</span>
                    </div>
                </div>
            `;
            
            modal.style.display = 'flex';
        }

        // Закрыть модальное окно
        function closeCarModal() {
            document.getElementById('carModal').style.display = 'none';
            selectedCar = null;
        }

        // Очистить фильтры
        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('statusFilter').value = '';
            filterCars();
        }

        // Получение класса статуса
        function getStatusClass(status) {
            switch (status) {
                case 'active': return 'success';
                case 'noticed': return 'warning';
                case 'pending': return 'primary';
                case 'deleted': return 'error';
                case 'archived': return 'error';
                case 'blocked': return 'error';
                default: return 'primary';
            }
        }

        // Получение иконки статуса
        function getStatusIcon(status) {
            switch (status) {
                case 'active': return '✅';
                case 'noticed': return '👁️';
                case 'pending': return '⏳';
                case 'deleted': return '🗑️';
                case 'archived': return '📦';
                case 'blocked': return '🚫';
                default: return '❓';
            }
        }

        // Получение текста статуса
        function getStatusText(status) {
            switch (status) {
                case 'active': return 'Активен';
                case 'noticed': return 'Замечен';
                case 'pending': return 'Ожидает';
                case 'deleted': return 'Удален';
                case 'archived': return 'В архиве';
                case 'blocked': return 'Заблокирован';
                default: return 'Неизвестен';
            }
        }

        // Форматирование даты
        function formatDate(dateString) {
            if (!dateString) return 'Не указана';
            
            const date = new Date(dateString);
            return date.toLocaleDateString('ru-RU', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        // Закрытие модального окна по клику вне его
        document.addEventListener('click', function(event) {
            const modal = document.getElementById('carModal');
            if (event.target === modal) {
                closeCarModal();
            }
        });

        // Обработка кликов по футеру
        document.addEventListener('DOMContentLoaded', function() {
            // Обработка кликов по элементам футера
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    // Если это не активная кнопка "Авто"
                    if (!this.classList.contains('active')) {
                        showDevModal();
                        // Haptic feedback для Telegram
                        if (tg && tg.HapticFeedback) {
                            tg.HapticFeedback.impactOccurred('light');
                        }
                    }
                });
            });
        });

        // Показать модальное окно "В разработке"
        function showDevModal() {
            document.getElementById('devModal').style.display = 'flex';
        }

        // Закрыть модальное окно "В разработке"
        function closeDevModal() {
            document.getElementById('devModal').style.display = 'none';
        }
    </script>
</body>
</html>
