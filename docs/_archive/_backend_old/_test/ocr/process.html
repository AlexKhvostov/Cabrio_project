<!--
    Тестовая страница для объединённого OCR-эндпоинта CabrioRide
    ---------------------------------------------------------
    📋 Назначение:
    - Тестирует работу /app/backend/api/ocr/process.php (распознавание номера + поиск в базе)
    - Позволяет загрузить фото автомобиля, отправить его на сервер и получить результат распознавания и проверки

    🛠️ Как работает:
    1. Пользователь выбирает фото автомобиля (JPG/PNG)
    2. Фото конвертируется в base64 и отправляется в JSON-запросе:
       {
         auth: { user_id: 1, role: 'member' },
         data: { image: 'data:image/jpeg;base64,...' }
       }
    3. Сервер возвращает результат:
       - Распознан ли номер (plate, confidence)
       - Найден ли автомобиль в базе (found, status)
    4. Страница красиво отображает результат: номер, уверенность, статус, найден/не найден

    🟢 Для успешного теста:
    - Фото должно быть чётким, номер читаемым
    - Уверенность > 0% — номер распознан
    - Если авто найден — показывается статус и сообщение "Можно оставить визитку"
    - Если не найден — "Можно добавить в базу"
    - Все ошибки и нераспознанные номера отображаются явно

    👨‍💻 Для разработчиков:
    - Страница не требует перезагрузки, всё работает через JS
    - Можно использовать для ручного тестирования и отладки OCR/бэкенда
    - Код легко модифицировать под другие endpoint или сценарии
-->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест OCR Process API</title>
    <style>
        body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0; padding: 0; }
        .container { max-width: 500px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 24px #0002; padding: 32px 28px; }
        h1 { text-align: center; color: #4a4a4a; margin-bottom: 24px; letter-spacing: 1px; }
        .form-group { margin-bottom: 22px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #555; }
        input[type="file"] { margin-bottom: 10px; }
        .preview { display: block; margin: 12px auto 24px auto; max-width: 240px; border-radius: 8px; box-shadow: 0 2px 8px #0001; border: 2px solid #e3e3e3; }
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; border: none; padding: 14px 32px; border-radius: 6px; font-size: 1.1em; cursor: pointer; transition: background 0.2s; font-weight: 600; letter-spacing: 0.5px; }
        button:hover { background: linear-gradient(135deg, #5a67d8 0%, #764ba2 100%); }
        .result { margin-top: 28px; padding: 20px; border-radius: 10px; background: #f8f9fa; box-shadow: 0 2px 8px #0001; font-size: 1.08em; }
        .success-block { background: #e6ffed; border-left: 6px solid #38c172; color: #22543d; padding: 18px 18px 12px 18px; border-radius: 8px; margin-bottom: 12px; }
        .error-block { background: #fff5f5; border-left: 6px solid #e53e3e; color: #742a2a; padding: 18px 18px 12px 18px; border-radius: 8px; margin-bottom: 12px; }
        .plate { font-size: 2.1em; font-weight: bold; letter-spacing: 2px; color: #333; margin-bottom: 8px; }
        .confidence { font-size: 1.1em; color: #555; margin-bottom: 6px; }
        .car-status { font-size: 1.1em; color: #4a5568; margin-bottom: 6px; }
        .icon { font-size: 2.2em; vertical-align: middle; margin-right: 8px; }
        .json { background: #222; color: #e2e8f0; padding: 10px; border-radius: 4px; font-size: 0.95em; margin-top: 10px; overflow-x: auto; }
    </style>
</head>
<body>
<div class="container">
    <h1>🧪 OCR Process API</h1>
    <form id="ocrForm">
        <div class="form-group">
            <label for="imageInput">Фото автомобиля (JPG/PNG):</label>
            <input type="file" id="imageInput" accept="image/*" required>
            <img id="preview" class="preview" style="display:none;" alt="preview">
        </div>
        <button type="submit">🚀 Отправить</button>
    </form>
    <div id="result" class="result" style="display:none;"></div>
    <div id="json" class="json" style="display:none;"></div>
</div>
<script>
const form = document.getElementById('ocrForm');
const imageInput = document.getElementById('imageInput');
const preview = document.getElementById('preview');
const resultBox = document.getElementById('result');
const jsonBox = document.getElementById('json');

imageInput.addEventListener('change', function() {
    const file = imageInput.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = e => {
            preview.src = e.target.result;
            preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
    } else {
        preview.style.display = 'none';
    }
});

form.addEventListener('submit', function(e) {
    e.preventDefault();
    const file = imageInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(ev) {
        const base64 = ev.target.result;
        const req = {
            auth: { user_id: 1, role: 'member' },
            data: { image: base64 }
        };
        resultBox.style.display = 'none';
        jsonBox.style.display = 'none';
        resultBox.innerHTML = '⏳ Отправка запроса...';
        resultBox.className = 'result';
        resultBox.style.display = 'block';
        try {
            const resp = await fetch('/app/backend/api/ocr/process.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(req)
            });
            const data = await resp.json();
            jsonBox.textContent = JSON.stringify(data, null, 2);
            jsonBox.style.display = 'block';
            // Разбор результата
            const ocr = data?.result?.data?.ocr;
            const check = data?.result?.data?.check;
            const plate = ocr?.result?.data?.plate ? String(ocr.result.data.plate).toUpperCase() : undefined;
            const confidence = ocr?.result?.data?.confidence ?? 0;
            const found = check?.result?.data?.found;
            let html = '';
            if (data.success && ocr?.success && plate) {
                html += `<div class='success-block'>
                    <span class='icon'>🔎</span> <span class='plate'>${plate}</span><br>
                    <span class='confidence'>Уверенность: <b>${(confidence*100).toFixed(1)}%</b></span><br>`;
                if (found) {
                    html += `<span class='icon'>🚗</span> <span class='car-status'>Статус: <b>${check?.result?.data?.status || '—'}</b></span><br>`;
                    html += `<div style='margin-top:10px;'>✅ <b>Автомобиль найден в базе клуба.</b> <span style='color:#38c172;'>Можно оставить визитку.</span></div>`;
                } else {
                    html += `<div style='margin-top:10px;'>📝 <b>Автомобиль не найден в базе клуба.</b> <span style='color:#805ad5;'>Можно добавить в базу.</span></div>`;
                }
                html += `</div>`;
            } else if (data.success && ocr?.success && !plate) {
                html += `<div class='error-block'>❌ Не удалось распознать номер. Попробуйте другое фото.</div>`;
            } else {
                html += `<div class='error-block'>Ошибка: ${data.error?.message || 'Неизвестная ошибка'}</div>`;
            }
            resultBox.innerHTML = html;
        } catch (err) {
            resultBox.innerHTML = `<div class='error-block'>Ошибка сети или сервера: ${err.message}</div>`;
        }
    };
    reader.readAsDataURL(file);
});
</script>
</body>
</html>
