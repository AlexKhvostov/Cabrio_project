<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebApp Auth Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h1>WebApp Auth Test</h1>
    <div id="status">Loading...</div>
    <button onclick="testAuth()">Test Auth</button>
    <div id="result"></div>

    <script>
        // Имитируем Telegram WebApp данные для тестирования
        const mockTelegramData = {
            user: {
                id: 287536885,
                first_name: "Lex",
                last_name: "",
                username: "LihachOK",
                language_code: "ru"
            },
            init_data: "query_id=AAHdF6IQAAAAAN0XohDhrOrc&user=%7B%22id%22%3A287536885%2C%22first_name%22%3A%22Lex%22%2C%22last_name%22%3A%22%22%2C%22username%22%3A%22LihachOK%22%2C%22language_code%22%3A%22ru%22%7D&auth_date=1733241600&hash=1234567890abcdef"
        };

        // Инициализация Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            document.getElementById('status').innerHTML = 'Telegram WebApp initialized';
        } else {
            document.getElementById('status').innerHTML = 'Telegram WebApp not available, using mock data';
        }

        async function testAuth() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing authentication...';
            
            try {
                // Формируем заголовки с Telegram данными
                const headers = {
                    'Content-Type': 'application/json',
                    'X-Telegram-User-Id': mockTelegramData.user.id,
                    'X-Telegram-First-Name': mockTelegramData.user.first_name,
                    'X-Telegram-Last-Name': mockTelegramData.user.last_name,
                    'X-Telegram-Username': mockTelegramData.user.username,
                    'X-Telegram-Auth-Date': Math.floor(Date.now() / 1000),
                    'X-Telegram-Hash': 'test_hash_' + Date.now()
                };

                // Тестируем авторизацию
                const response = await fetch('https://contributed-cm-component-consideration.trycloudflare.com/app/backend/test_auth.php', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        telegram_data: mockTelegramData
                    })
                });

                const data = await response.json();
                
                resultDiv.innerHTML = `
                    <h3>Auth Test Result:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>Error:</h3>
                    <pre>${error.message}</pre>
                `;
            }
        }

        // Автоматически запускаем тест при загрузке
        window.addEventListener('load', () => {
            setTimeout(testAuth, 1000);
        });
    </script>
</body>
</html>
