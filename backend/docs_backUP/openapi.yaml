openapi: 3.0.0
info:
  title: CabrioRide Backend API
  version: 1.0.0
  description: |
    Документация API для backend CabrioRide. Здесь описаны все эндпоинты, параметры, ответы и примеры.
    
    Актуальность: обновлять при каждом изменении API!

servers:
  - url: /api

paths:
  /users:
    get:
      summary: Получить список пользователей
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/Status'
        city:
          type: string
        photos:
          type: array
          items:
            $ref: '#/components/schemas/Photo'
        created_at:
          type: string
          format: date-time
    Role:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        description:
          type: string
    Status:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        description:
          type: string
    Photo:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        description:
          type: string 