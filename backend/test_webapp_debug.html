<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebApp Debug</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h1>WebApp Debug</h1>
    <div id="status">Loading...</div>
    <div id="telegram-info"></div>
    <div id="api-test"></div>

    <script>
        // Отладочная информация
        function log(message) {
            console.log(message);
            document.getElementById('status').innerHTML += '<br>' + message;
        }

        // Проверяем Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            log('Telegram WebApp доступен');
            window.Telegram.WebApp.ready();
            log('WebApp готов');
            
            const webApp = window.Telegram.WebApp;
            const info = `
                <h3>Telegram WebApp Info:</h3>
                <p>Platform: ${webApp.platform}</p>
                <p>Version: ${webApp.version}</p>
                <p>InitData: ${webApp.initData ? 'Available' : 'Not available'}</p>
                <p>User: ${webApp.initDataUnsafe?.user?.first_name || 'Unknown'}</p>
            `;
            document.getElementById('telegram-info').innerHTML = info;
        } else {
            log('Telegram WebApp НЕ доступен');
        }

        // Тестируем API
        async function testAPI() {
            try {
                log('Тестируем API...');
                const response = await fetch('https://contributed-cm-component-consideration.trycloudflare.com/app/backend/test_data.php?route=/api/users');
                const data = await response.json();
                
                const apiInfo = `
                    <h3>API Test Result:</h3>
                    <p>Status: ${response.status}</p>
                    <p>Success: ${data.success}</p>
                    <p>Data count: ${data.data ? data.data.length : 0}</p>
                `;
                document.getElementById('api-test').innerHTML = apiInfo;
                log('API тест завершен');
            } catch (error) {
                log('API ошибка: ' + error.message);
            }
        }

        // Запускаем тест через 1 секунду
        setTimeout(testAPI, 1000);
    </script>
</body>
</html>
